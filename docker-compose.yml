services:
  postgres:
    image: postgres:16
    container_name: cex-postgres
    environment:
      POSTGRES_USER: cex
      POSTGRES_PASSWORD: cex
      POSTGRES_DB: cex
    ports:
      - "5433:5432"   # 5433 on the host: a local Postgres may already use 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cex -d cex"]
      interval: 2s
      timeout: 3s
      retries: 15
